    - hair drier
    - toothbrush
    nc: 80
    num_workers: 0
    root: /media/oem/personal_vol/yklee/ssod_yolo_mc/src/data/semi_supervised
    seed: 1
    val:
      images: /media/oem/personal_vol/yklee/data/COCO/val2017/images
      labels: /media/oem/personal_vol/yklee/data/COCO/val2017/labels
      root: /media/oem/personal_vol/yklee/data/COCO/val2017
  evaluation:
    metrics:
    - mAP50
    - mAP50-95
    uncertainty_metrics:
    - entropy
    - variance
  gpu:
    auto_detect: true
    distributed:
      backend: nccl
      enabled: true
      local_rank: null
      master_addr: localhost
      master_port: '12355'
      rank: null
      world_size: null
    gpu_ids:
    - 0
    - 1
    - 2
    - 3
    memory:
      gradient_accumulation: 1
      mixed_precision: true
      non_blocking: true
      pin_memory: true
    use_gpu: true
  inference:
    conf_threshold: 0.25
    device: null
  model:
    dropout:
      enabled: true
      num_samples: 5
      rate: 0.1
    ema:
      decay: 0.999
      enabled: true
    feature_alignment:
      enabled: true
      weight: 0.1
    name: yolov8m
    pretrained: true
    size: m
    task: detect
    version: v8
  training:
    batch_size: 16
    checkpoint_dir: checkpoints
    ema:
      decay: 0.999
    epochs: 20
    feature_alignment:
      levels:
      - P3
      - P4
      - P5
      weight: 0.1
    grad_clip:
      max_norm: 10.0
    img_size: 640
    learning_rate: 0.001
    loss_weights:
      semi_supervised:
        bbox_loss_type: ciou
        box_loss_gain: 7.5
        cls_loss_gain: 0.5
        focal_loss_gamma: 0.0
        label_smoothing: 0.0
        obj_loss_gain: 1.0
        uncertainty_alpha: 5.0
      supervised:
        bbox_loss_type: ciou
        box_loss_gain: 7.5
        cls_loss_gain: 0.5
        focal_loss_gamma: 0.0
        label_smoothing: 0.0
        obj_loss_gain: 1.0
    mature_epoch: 5
    mc_loss:
      adaptive_weighting: true
      alpha: 1.0
      beta: 0.5
      gamma: 0.3
      temperature: 1.0
    momentum: 0.937
    optimizer:
      lr: 0.001
      momentum: 0.937
      name: SGD
      weight_decay: 0.0005
    save_interval: 1
    scheduler:
      name: cosine
      warmup_bias_lr: 0.1
      warmup_epochs: 3
      warmup_momentum: 0.8
    semi_supervised:
      bbox_consistency_weight: 1.0
      class_consistency_weight: 1.0
      conf_threshold: 0.5
      consistency_loss_type: kl_divergence
      consistency_temperature: 3.0
      consistency_weight: 0.1
      enabled: true
      max_pseudo_labels: 2000
      mc_consistency_alpha: 1.0
      mc_consistency_beta: 0.5
      mc_consistency_temperature: 1.0
      mc_consistency_weight: 0.0
      mc_uncertainty_threshold: 0.1
      mc_use_adaptive_weighting: true
      num_mc_samples: 10
      obj_consistency_weight: 1.0
      pseudo_label_start_epoch: 5
      pseudo_label_weight: 0.5
      uncertainty:
        box_std_threshold: 0.1
        confidence_threshold: 0.7
        entropy_threshold: 0.5
        min_detections: 3
        reliability_threshold: 0.5
      uncertainty_alpha: 5.0
      uncertainty_weight: 5.0
      unlabeled_weight: 0.5
    uncertainty_weight: 5.0
    val_interval: 5
    warmup_bias_lr: 0.1
    warmup_epochs: 3
    warmup_momentum: 0.8
    weight_decay: 0.0005
