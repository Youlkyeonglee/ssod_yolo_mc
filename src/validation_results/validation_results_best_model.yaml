config:
  data:
    augment: true
    augmentation:
      strong:
        affine:
          scale:
          - 0.9
          - 1.1
          translate:
          - 0.1
          - 0.1
        color_jitter:
          brightness: 0.4
          contrast: 0.4
          hue: 0.1
          saturation: 0.3
        cutout:
          length: 32
          n_holes: 1
        horizontal_flip: 0.5
        perspective: 0.2
        rotation: 15
      weak:
        color_jitter:
          brightness: 0.2
          contrast: 0.2
          hue: 0.05
          saturation: 0.1
        horizontal_flip: 0.5
    batch_size: 16
    coco:
      train_root: /media/oem/personal_vol/yklee/data/COCO/train2017
      unlabeled_root: /media/oem/personal_vol/yklee/data/COCO/unlabeled2017
    format: yolo
    img_size: 640
    labeled_ratio: 10.0
    max_samples: null
    names:
    - person
    - bicycle
    - car
    - motorcycle
    - airplane
    - bus
    - train
    - truck
    - boat
    - traffic light
    - fire hydrant
    - stop sign
    - parking meter
