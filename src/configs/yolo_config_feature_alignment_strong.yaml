# 🎯 Feature Alignment 강한 가중치 실험 설정 (weight: 0.2)

model:
  version: "v8"
  size: "m"
  task: "detect"
  pretrained: true
  name: "yolov8m"
  dropout:
    enabled: true
    rate: 0.1
    num_samples: 10
  
  # 💪 Feature Alignment 강한 가중치
  feature_alignment:
    enabled: true           # Feature alignment 활성화
    weight: 0.2            # 강한 Feature alignment 가중치
  
  ema:
    enabled: true
    decay: 0.999

inference:
  conf_threshold: 0.25
  device: null

gpu:
  use_gpu: true
  auto_detect: true
  gpu_ids: [0, 1, 2, 3]
  distributed:
    enabled: true
    backend: "nccl"
    master_addr: "localhost"
    master_port: "12355"
  memory:
    mixed_precision: true
    gradient_accumulation: 1
    pin_memory: true
    non_blocking: true

data:
  root: "/media/oem/personal_vol/yklee/ssod_yolo_mc/src/data/semi_supervised"
  coco:
    train_root: "/media/oem/personal_vol/yklee/data/COCO/train2017"
    unlabeled_root: "/media/oem/personal_vol/yklee/data/COCO/unlabeled2017"
  val:
    root: "/media/oem/personal_vol/yklee/data/COCO/val2017"
    images: "/media/oem/personal_vol/yklee/data/COCO/val2017/images"
    labels: "/media/oem/personal_vol/yklee/data/COCO/val2017/labels"
  format: "yolo"
  nc: 80
  names: ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", 
          "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", 
          "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", 
          "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", 
          "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", 
          "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", 
          "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", 
          "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"]
  img_size: 640
  batch_size: 16
  num_workers: 0
  augment: true
  max_samples: null
  labeled_ratio: 10.0
  seed: 1
  
  augmentation:
    weak:
      horizontal_flip: 0.5
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.1
        hue: 0.05
    strong:
      horizontal_flip: 0.5
      color_jitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.3
        hue: 0.1
      rotation: 15
      affine:
        translate: [0.1, 0.1]
        scale: [0.9, 1.1]
      perspective: 0.2
      cutout:
        n_holes: 1
        length: 32

training:
  epochs: 20
  mature_epoch: 5
  batch_size: 16
  img_size: 640
  learning_rate: 0.001
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  uncertainty_weight: 5.0
  
  mc_loss:
    alpha: 1.0
    beta: 0.5
    gamma: 0.3
    temperature: 1.0
    adaptive_weighting: true
  
  loss_weights:
    supervised:
      box_loss_gain: 7.5
      cls_loss_gain: 0.5
      obj_loss_gain: 1.0
      bbox_loss_type: "ciou"
      focal_loss_gamma: 0.0
      label_smoothing: 0.0
    semi_supervised:
      box_loss_gain: 7.5
      cls_loss_gain: 0.5
      obj_loss_gain: 1.0
      uncertainty_alpha: 5.0
      bbox_loss_type: "ciou"
      focal_loss_gamma: 0.0
      label_smoothing: 0.0
  
  optimizer:
    name: "SGD"
    lr: 0.001
    momentum: 0.937
    weight_decay: 0.0005
  
  scheduler:
    name: "cosine"
    warmup_epochs: 3
    warmup_momentum: 0.8
    warmup_bias_lr: 0.1
  
  save_interval: 5
  val_interval: 5
  checkpoint_dir: "checkpoints"
  
  semi_supervised:
    enabled: true
    pseudo_label_start_epoch: 5
    unlabeled_weight: 0.5
    conf_threshold: 0.5
    max_pseudo_labels: 2000
    
    consistency_loss_type: "kl_divergence"
    consistency_temperature: 3.0
    bbox_consistency_weight: 1.0
    class_consistency_weight: 1.0
    obj_consistency_weight: 1.0
    
    uncertainty:
      box_std_threshold: 0.1
      entropy_threshold: 0.5
      min_detections: 3
    uncertainty_weight: 5.0
    uncertainty_alpha: 5.0
    consistency_weight: 0.1
    num_mc_samples: 10
    
    uncertainty:
      box_std_threshold: 0.1
      entropy_threshold: 0.5
      confidence_threshold: 0.7
      reliability_threshold: 0.8
  
  # 💪 Feature Alignment 강한 가중치
  feature_alignment:
    weight: 0.2             # 강한 feature alignment loss 가중치
    levels: ['P3', 'P4', 'P5']
  
  ema:
    decay: 0.999
    
  grad_clip:
    max_norm: 10.0

evaluation:
  metrics: ["mAP50", "mAP50-95"]
  uncertainty_metrics: ["entropy", "variance"] 