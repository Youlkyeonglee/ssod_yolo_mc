# YOLO MC Dropout Semi-Supervised Learning Configuration
# 테스트용 설정 (빠른 실행)

model:
  name: "yolov8m"  # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  dropout:
    rate: 0.1  # MC Dropout rate
    num_samples: 5  # MC 샘플링 횟수 (테스트용으로 감소)
  feature_alignment:
    enabled: true
    weight: 0.1
  ema:
    decay: 0.999

# GPU 및 분산 학습 설정
gpu:
  auto_detect: true               # GPU 자동 탐지
  gpu_ids: [0, 1]          # 사용할 GPU ID 리스트 (테스트용으로 2개만)
  
  # 분산 학습 설정
  distributed:
    enabled: true                # 분산 학습 활성화 (테스트)
    backend: "nccl"
    master_addr: "localhost"
    master_port: "12355"
    
  # 메모리 관리
  memory:
    mixed_precision: true
    gradient_accumulation: 1
    pin_memory: true
    non_blocking: true

data:
  # 데이터셋 경로
  root: "/media/oem/personal_vol/yklee/ssod_yolo_mc/src/data/semi_supervised"
  
  # COCO 학습 데이터 경로
  coco:
    train_root: "/media/oem/personal_vol/yklee/data/COCO/train2017"
    unlabeled_root: "/media/oem/personal_vol/yklee/data/COCO/unlabeled2017"
  
  val:
    root: "/media/oem/personal_vol/yklee/data/COCO/val2017"
    images: "/media/oem/personal_vol/yklee/data/COCO/val2017/images"
    labels: "/media/oem/personal_vol/yklee/data/COCO/val2017/labels"
  
  # 데이터셋 구조
  format: "yolo"
  
  # 클래스 설정
  nc: 80
  names: ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", 
          "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", 
          "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", 
          "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", 
          "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", 
          "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", 
          "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", 
          "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"]
  
  # 이미지 설정
  img_size: 640
  batch_size: 8  # 테스트용으로 배치 크기 감소
  num_workers: 0
  augment: true
  max_samples: 10  # 테스트용: 매우 적은 샘플
  labeled_ratio: 10.0
  seed: 1

training:
  # 학습 파라미터 (테스트용)
  epochs: 1  # 테스트용: 1 에포크만
  mature_epoch: 1
  batch_size: 8
  img_size: 640
  learning_rate: 0.001
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 0  # 테스트용으로 워밍업 비활성화
  uncertainty_weight: 5.0
  
  # 옵티마이저 설정
  optimizer:
    name: "SGD"
    lr: 0.001
    momentum: 0.937
    weight_decay: 0.0005
  
  # 저장 설정
  save_interval: 1
  val_interval: 1
  checkpoint_dir: "checkpoints"
  
  # Semi-supervised 학습 설정
  semi_supervised:
    enabled: true
    pseudo_label_start_epoch: 1  # 첫 에포크부터 pseudo label 시작
    unlabeled_weight: 0.5
    conf_threshold: 0.5
    max_pseudo_labels: 100  # 테스트용으로 제한
    
    # MC Dropout 설정
    uncertainty:
      box_std_threshold: 0.1
      entropy_threshold: 0.5
      min_detections: 1  # 테스트용으로 감소
    uncertainty_weight: 5.0
    uncertainty_alpha: 5.0
    consistency_weight: 0.1
    num_mc_samples: 5  # 테스트용으로 감소
    
    # 분포 기반 Consistency Loss 설정
    consistency_loss_type: "kl_divergence"
    consistency_temperature: 3.0
    bbox_consistency_weight: 1.0
    class_consistency_weight: 1.0
    obj_consistency_weight: 1.0
    
    # 불확실성 필터링 임계값
    uncertainty:
      box_std_threshold: 0.1
      entropy_threshold: 0.5
      confidence_threshold: 0.7
      reliability_threshold: 0.8
  
  # Feature Alignment 설정
  feature_alignment:
    weight: 0.1
    levels: ['P3', 'P4', 'P5']
  
  # EMA 설정
  ema:
    decay: 0.999
    
  # Loss 가중치 설정
  loss_weights:
    supervised:
      box_loss_gain: 7.5
      cls_loss_gain: 0.5
      obj_loss_gain: 1.0
      bbox_loss_type: "ciou"
      focal_loss_gamma: 0.0
      label_smoothing: 0.0

evaluation:
  metrics: ["mAP50", "mAP50-95"]
  uncertainty_metrics: ["entropy", "variance"]

inference:
  device: "cuda:0"
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 1000 