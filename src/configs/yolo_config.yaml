model:
  version: "v8"  # v8, v9, v10, v11, v12
  size: "m"      # n, s, m, l, x
  task: "detect" # detect, segment, pose, classify
  pretrained: true  # pre-trained 가중치 사용하지 않음
  name: "yolov8m"
  dropout:
    enabled: true
    num_samples: 10
    rate: 0.1
  
  # 🎯 Feature Alignment 실험 설정
  feature_alignment:
    enabled: true           # Feature alignment 활성화/비활성화 (실험 변수)
    weight: 0.1            # Feature alignment loss 가중치 (실험 변수: 0.05, 0.1, 0.2)
    
    # 실험 시나리오:
    # - enabled: true, weight: 0.1   → Feature Alignment 포함 (Proposed)
    # - enabled: false, weight: 0.0  → Feature Alignment 제외 (Baseline)
    # - enabled: true, weight: 0.05  → 약한 Feature Alignment
    # - enabled: true, weight: 0.2   → 강한 Feature Alignment
  
  # Teacher-Student EMA 설정
  ema:
    enabled: true
    decay: 0.999  # EMA decay rate (0.999 권장, 0.99-0.9999 범위)

inference:
  conf_threshold: 0.25
  
# GPU 및 분산 학습 설정
gpu:
  # GPU 사용 설정
  use_gpu: true                    # GPU 사용 여부
  auto_detect: true                # 자동 GPU 감지 (true일 경우 gpu_ids 무시)
  gpu_ids: [0, 1, 2, 3]           # 사용할 GPU ID 리스트 (auto_detect가 false일 때 사용)
  

    
  # 메모리 관리
  memory:
    mixed_precision: true         # 혼합 정밀도 학습 (AMP)
    gradient_accumulation: 1      # 그래디언트 누적 단계
    pin_memory: true              # DataLoader pin_memory 설정
    non_blocking: true            # 비동기 GPU 전송
  
data:
  # 데이터셋 경로
  root: "/media/oem/personal_vol/yklee/ssod_yolo_mc/src/data/semi_supervised"  # 데이터 리스트 파일이 있는 디렉토리
  
  # COCO 학습 데이터 경로
  coco:
    train_root: "/media/oem/personal_vol/yklee/data/COCO/train2017"
    unlabeled_root: "/media/oem/personal_vol/yklee/data/COCO/unlabeled2017"
  
  val:
    root: "/media/oem/personal_vol/yklee/data/COCO/val2017"
    images: "/media/oem/personal_vol/yklee/data/COCO/val2017/images"
    labels: "/media/oem/personal_vol/yklee/data/COCO/val2017/labels"
  
  # 데이터셋 구조
  format: "yolo"  # 데이터셋 형식 (yolo, coco, voc 등)
  max_samples: null
  # 클래스 설정
  nc: 80  # number of classes
  names: ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", 
          "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", 
          "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", 
          "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", 
          "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", 
          "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", 
          "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", 
          "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"]  # COCO 데이터셋의 80개 클래스
  
  # 이미지 설정
  img_size: 640  # 입력 이미지 크기
  batch_size: 16  # 배치 크기
  num_workers: 0  # DataLoader 멀티프로세싱 비활성화 (에러 방지)
  augment: true  # 데이터 증강 사용 여부
  labeled_ratio: 1.0  # 레이블된 데이터 비율 (1, 2, 5, 10)
  seed: 1 # 데이터 분포 시드 (1,2,3,4,5)
  
  # Teacher-Student Augmentation 전략
  augmentation:
    weak:  # Teacher model (안정적 pseudo label 생성)
      horizontal_flip: 0.5
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.1
        hue: 0.05
    strong:  # Student model (robust 특징 학습)
      horizontal_flip: 0.5
      color_jitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.3
        hue: 0.1
      rotation: 15
      affine:
        translate: [0.1, 0.1]
        scale: [0.9, 1.1]
      perspective: 0.2
      cutout:
        n_holes: 1
        length: 32
inference:
  device: null

training:
  # 학습 파라미터
  epochs: 100
  batch_size: 16  # 배치 크기 줄임
  learning_rate: 0.001  # 학습률 낮춤 (기존 0.01에서)
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5  # box loss gain
  cls: 0.5  # cls loss gain  
  dfl: 1.5  # dfl loss gain
  pose: 12.0  # pose loss gain (only for pose models)
  kobj: 2.0  # keypoint obj loss gain (only for pose models)
  label_smoothing: 0.0  # label smoothing epsilon
  nbs: 64  # nominal batch size
  overlap_mask: True  # masks should overlap during training (only train segment)
  mask_ratio: 4  # mask downsample ratio (only train segment)
  dropout: 0.0  # use dropout regularization (only train classify)
  val: True  # val during training
  plots: True
  save: True
  save_period: -1  # Save checkpoint every x epochs (disabled if < 1)
  cache: False  # cache images for faster training (RAM)
  device: ''  # cuda device, i.e. 0 or 0,1,2,3 or cpu
  workers: 8  # number of worker threads for data loading (per RANK in DDP mode)
  project: ''  # save to project/name
  name: ''  # save to project/name
  exist_ok: False  # existing project/name ok, do not increment
  pretrained: True  # use pretrained model
  optimizer: 'auto'  # optimizer (SGD, Adam, etc.)
  verbose: True  # verbose output
  seed: 0  # random seed for reproducibility
  deterministic: True  # deterministic training
  single_cls: False  # train as single-class dataset
  rect: False  # rectangular training
  cos_lr: False  # cosine learning rate scheduler
  close_mosaic: 10  # disable mosaic augmentation for final 10 epochs
  resume: False  # resume training from last checkpoint
  amp: True  # Automatic Mixed Precision (AMP) training
  fraction: 1.0  # dataset fraction to train on (experimental)
  profile: False  # profile ONNX and TensorRT speeds during training for loggers
  freeze: null  # (int or list, optional) freeze first n layers, or freeze list of layer indices during training
  multi_scale: False  # vary img-size +/- 50% (experimental)
  
  # Semi-supervised learning settings
  semi_supervised:
    enabled: true
    pseudo_label_start_epoch: 5  # 의사 레이블링 시작 에포크
    unlabeled_weight: 0.5      # unlabeled 데이터 손실 가중치
    pseudo_label_weight: 0.5   # pseudo label 가중치 (호환성)
    conf_threshold: 0.1           # 의사 레이블 신뢰도 임계값
    max_pseudo_labels: null       # 최대 의사 레이블 개수 (null: 제한 없음)
    num_mc_samples: 10            # MC Dropout 샘플링 횟수
    
    # 🎯 분포 기반 Consistency Loss 설정
    consistency_loss_type: "kl_divergence"  # 'kl_divergence', 'js_divergence', 'kl_js_combined', 'wasserstein', 'cosine'
    consistency_temperature: 3.0            # Temperature scaling for softmax distributions
    bbox_consistency_weight: 1.0            # BBox coordinates consistency 가중치
    class_consistency_weight: 1.0           # Class logits consistency 가중치
    
    # 🎯 MC Dropout Consistency Loss 설정 (신규) - 임시 비활성화
    mc_consistency_weight: 0.0              # MC Consistency Loss 가중치 (임시 비활성화)
    mc_consistency_alpha: 1.0               # Pseudo label consistency weight
    mc_consistency_beta: 0.5                # MC uncertainty regularization weight
    mc_consistency_temperature: 1.0         # Temperature scaling for uncertainty
    mc_uncertainty_threshold: 0.1           # 불확실성 임계값
    mc_use_adaptive_weighting: true         # 적응적 가중치 사용 여부
    obj_consistency_weight: 1.0             # Objectness consistency 가중치
    
    # MC Dropout 설정
    uncertainty:
      box_std_threshold: 5.0           # bbox 표준편차/불확실성 임계값
      entropy_threshold: 5.0           # 클래스 예측 불확실성/엔트로피 임계값
      min_detections: 3              # 유효한 의사 레이블로 간주하기 위한 최소 탐지 횟수
      confidence_threshold: 0.1       # 신뢰도 임계값
      reliability_threshold: 0.3      # 다층 신뢰도 평가 임계값
      # 동적 임계값 설정
      adaptive_thresholds: true       # 동적 임계값 조정 활성화
      threshold_momentum: 0.9         # 임계값 업데이트 모멘텀 (0.9 = 90% 이전값 + 10% 새값)
      threshold_ratio: 0.8            # 평균값 대비 임계값 비율 (0.8 = 평균의 80%)
    uncertainty_weight: 5.0           # pseudo label loss 가중치
    uncertainty_alpha: 5.0            # 불확실성 기반 가중치 조정
    consistency_weight: 0.1           # MC consistency loss 가중치
    
  # 저장 설정
  save_interval: 1  # 매 에포크마다 저장 및 평가
  val_interval: 5      # 매 에포크마다 검증
  checkpoint_dir: "checkpoints"
  
  # Semi-supervised 학습 설정
  loss_weights:
    supervised:
      box_loss_gain: 3.0
      cls_loss_gain: 0.3
      obj_loss_gain: 0.2
      bbox_loss_type: "ciou"
      focal_loss_gamma: 0.0
      label_smoothing: 0.0
    semi_supervised:
      box_loss_gain: 3.5
      cls_loss_gain: 0.3
      obj_loss_gain: 0.2
      bbox_loss_type: "ciou"
      focal_loss_gamma: 0.0
      label_smoothing: 0.0
      uncertainty_alpha: 5.0
      uncertainty_weight: 5.0
      consistency_weight: 0.1
      num_mc_samples: 10
      enabled: true
      pseudo_label_start_epoch: 70  # 의사 레이블링 시작 에포크
      unlabeled_weight: 0.5      # unlabeled 데이터 손실 가중치
      pseudo_label_weight: 0.5   # pseudo label 가중치 (호환성)
      conf_threshold: 0.1           # 의사 레이블 신뢰도 임계값
      max_pseudo_labels: 2000       # 최대 의사 레이블 개수 (null: 제한 없음)
      
      # 🎯 분포 기반 Consistency Loss 설정
      consistency_loss_type: "kl_divergence"  # 'kl_divergence', 'js_divergence', 'kl_js_combined', 'wasserstein', 'cosine'
      consistency_temperature: 3.0            # Temperature scaling for softmax distributions
      bbox_consistency_weight: 1.0            # BBox coordinates consistency 가중치
      class_consistency_weight: 1.0           # Class logits consistency 가중치
      
      # 🎯 MC Dropout Consistency Loss 설정 (신규) - 임시 비활성화
      mc_consistency_weight: 0.0              # MC Consistency Loss 가중치 (임시 비활성화)
      mc_consistency_alpha: 1.0               # Pseudo label consistency weight
      mc_consistency_beta: 0.5                # MC uncertainty regularization weight
      mc_consistency_temperature: 1.0         # Temperature scaling for uncertainty
      mc_uncertainty_threshold: 0.1           # 불확실성 임계값
      mc_use_adaptive_weighting: true         # 적응적 가중치 사용 여부
      obj_consistency_weight: 1.0             # Objectness consistency 가중치
      
      # MC Dropout 설정
      uncertainty:
        box_std_threshold: 5.0           # bbox 표준편차/불확실성 임계값
        entropy_threshold: 5.0           # 클래스 예측 불확실성/엔트로피 임계값
        min_detections: 3              # 유효한 의사 레이블로 간주하기 위한 최소 탐지 횟수
        confidence_threshold: 0.1       # 신뢰도 임계값
        reliability_threshold: 0.3      # 다층 신뢰도 평가 임계값
        # 동적 임계값 설정
        adaptive_thresholds: true       # 동적 임계값 조정 활성화
        threshold_momentum: 0.9         # 임계값 업데이트 모멘텀 (0.9 = 90% 이전값 + 10% 새값)
        threshold_ratio: 0.8            # 평균값 대비 임계값 비율 (0.8 = 평균의 80%)
      uncertainty_weight: 5.0           # pseudo label loss 가중치
      uncertainty_alpha: 5.0            # 불확실성 기반 가중치 조정
      consistency_weight: 0.1           # MC consistency loss 가중치
  
  # 옵티마이저 설정
  optimizer:
    name: "SGD"
    lr: 0.001
    momentum: 0.937
    weight_decay: 0.0005
  
  # 학습 스케줄러
  scheduler:
    name: "cosine"
    warmup_epochs: 3
    warmup_momentum: 0.8
    warmup_bias_lr: 0.1
  
  # Gradient clipping
  grad_clip:
    max_norm: 10.0          # gradient clipping threshold

evaluation:
  # 평가 메트릭
  metrics: ["mAP50", "mAP50-95"]
  # 불확실성 평가
  uncertainty_metrics: ["entropy", "variance"] 